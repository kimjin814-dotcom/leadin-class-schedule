function timeLabel(m){
  const h = Math.floor(m/60), mm = m%60;
  let period, dh;
  if(h<12){ period='오전'; dh=h; }
  else if(h===12){ period='오후'; dh=12; }
  else { period='오후'; dh=h-12; }
  return mm===0 ? `${period} ${dh}시` : `${period} ${dh}시 30분`;
}
function rangeLabel(start,dur){ return `${timeLabel(start)} ~ ${timeLabel(start+dur)}`; }
function formatTs(ts){
  const d = new Date(ts);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${mm}/${dd} ${hh}:${mi}`;
}
function cellKey(day,m){ return day+'-'+m; }
function getCap(day,m){ const v = capacities[cellKey(day,m)]; return (v===undefined||v===null)?DEFAULT_CAP:v; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

const SUPABASE_ANON_KEY = 'sb_publishable_juLs6nePyKJ5MzPcVTixsw_x8AOzq6H';

let sb = null;

// 카카오톡 인앱 브라우저 등 일부 환경에서 외부 CDN(Supabase SDK) 로딩이 늦거나 실패할 수 있어서,
// 바로 에러 내지 않고 잠깐 재시도해 본 뒤, 그래도 안 되면 명확한 에러 화면을 보여줌.
function waitForSupabaseSdk(timeoutMs){
  return new Promise((resolve, reject)=>{
    const start = Date.now();
    (function check(){
      if(window.supabase && typeof window.supabase.createClient === 'function'){
        resolve(window.supabase);
      } else if(Date.now() - start > timeoutMs){
        reject(new Error('supabase-sdk-load-timeout'));
      } else {
        setTimeout(check, 150);
      }
    })();
  });
}
function withTimeout(promise, ms, fallbackValue){
  return Promise.race([
    promise,
    new Promise(resolve=> setTimeout(()=> resolve(fallbackValue), ms))
  ]);
}

async function kvGet(key, fallback){
  if(!sb) return fallback;
  try{
    const result = await withTimeout(
      sb.from('app_kv').select('value').eq('key', key).maybeSingle(),
      8000,
      null
    );
    if(!result) return fallback; // 타임아웃(8초) 시 그냥 빈 값으로 진행
    const { data, error } = result;
    if(error || !data) return fallback;
    return JSON.parse(data.value);
  }catch(e){ return fallback; }
}
async function kvSet(key, value){
  if(!sb){ return false; }
  try{
    const result = await withTimeout(
      sb.from('app_kv').upsert({ key, value: JSON.stringify(value), updated_at: new Date().toISOString() }),
      8000,
      null
    );
    if(!result) return false;
    const { error } = result;
    if(error) throw error;
    return true;
  }catch(e){ return false; }
}

function hex2rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgb2hex(r,g,b){return '#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');}
function lerp(a,b,t){return a+(b-a)*t;}
function lerpColor(c1,c2,t){
  const a=hex2rgb(c1), b=hex2rgb(c2);
  return rgb2hex(lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t));
}
const HEAT_START = '#FDF6E6'; // 1명: 아주 연한 미색

const HEAT_LEVELS = 13;

function cellColor(count,cap){
  if(count<=0) return '#FBF8F1';
  if(isOver(count,cap)) return RED; // 정원(기본 14명) 도달 시 빨간색
  const t = Math.min(count-1, HEAT_LEVELS-1) / (HEAT_LEVELS-1); // 1명→0, 13명→1
  return lerpColor(HEAT_START, HEAT_END, t);
}
function isOver(count,cap){ return cap>0 && count>=cap; }
function textColorFor(count,cap){
  if(isOver(count,cap)) return '#fff';
  return count>=9 ? '#fff' : 'var(--ink)';
}

function setDuration(d){ selectedDuration = d; render(); }

/* ---- 신청 폼: 원시 30분 블록 선택 & 자동 병합 ---- */
function dayPicks(day){
  if(!rawPicks[day]) rawPicks[day] = new Set();
  return rawPicks[day];
}
function runContaining(day,start){
  const set = dayPicks(day);
  if(!set.has(start)) return [];
  let s=start; while(set.has(s-30)) s-=30;
  let e=start; while(set.has(e+30)) e+=30;
  const run=[]; for(let m=s;m<=e;m+=30) run.push(m);
  return run;
}
function isBlockFull(day,m){
  return getOverlapCountForBooking(day,m) >= getCap(day,m);
}
function toggleSelect(day,start){
  if(day==='토' && !SAT_OPEN_FOR_BOOKING){
    showToast('토요일 수업은 9월부터 신청할 수 있어요.');
    return;
  }
  const [open,close] = dayRange(day);
  const set = dayPicks(day);
  if(set.has(start)){
    runContaining(day,start).forEach(m=>set.delete(m));
    render(); return;
  }
  if(isBlockFull(day,start)){
    showToast('이 시간은 정원이 다 차서 마감됐어요.');
    return;
  }
  if(selectedDuration==='custom'){
    set.add(start);
  } else {
    const dur = selectedDuration;
    if(start+dur > close){ showToast(`마감(${timeLabel(close)})을 넘어서 이 시간에는 선택할 수 없어요.`); return; }
    for(let m=start; m<start+dur; m+=30){
      if(isBlockFull(day,m)){ showToast(`${timeLabel(m)} 시간이 정원이 다 차서, 이 길이로는 선택할 수 없어요.`); return; }
    }
    for(let m=start; m<start+dur; m+=30) set.add(m);
  }
  render();
}
function mergedSelections(){
  const result = [];
  DAYS.forEach(day=>{
    const starts = [...dayPicks(day)].sort((a,b)=>a-b);
    let i=0;
    while(i<starts.length){
      let s=starts[i], e=starts[i];
      while(i+1<starts.length && starts[i+1]===e+30){ i++; e=starts[i]; }
      result.push({ day, start:s, duration:(e-s)+30 });
      i++;
    }
  });
  return result;
}
function removeChip(day,start,duration){
  const set = dayPicks(day);
  for(let m=start; m<start+duration; m+=30) set.delete(m);
  render();
}
function clearAllPicks(){ rawPicks = {}; render(); }

/* ---- 학부모 셀프 조회 / 변경 ---- */
function flattenPicksToKeys(){
  const keys = new Set();
  DAYS.forEach(day=> dayPicks(day).forEach(m=> keys.add(cellKey(day,m))));
  return keys;
}
function loadPicksFromRegs(regs){
  rawPicks = {};
  regs.forEach(r=>{
    for(let m=r.start; m<r.start+r.duration; m+=30) dayPicks(r.day).add(m);
  });
}
function keysToRuns(keySet){
  const byDay = {};
  keySet.forEach(k=>{
    const idx = k.lastIndexOf('-');
    const day = k.slice(0, idx), m = parseInt(k.slice(idx+1),10);
    (byDay[day] = byDay[day]||[]).push(m);
  });
  const runs = [];
  Object.keys(byDay).forEach(day=>{
    const starts = byDay[day].sort((a,b)=>a-b);
    let i=0;
    while(i<starts.length){
      let s=starts[i], e=starts[i];
      while(i+1<starts.length && starts[i+1]===e+30){ i++; e=starts[i]; }
      runs.push({day, start:s, duration:(e-s)+30});
      i++;
    }
  });
  return runs;
}
function runsLabel(runs){
  if(!runs || runs.length===0) return '';
  return runs.map(r=> `${r.day} ${rangeLabel(r.start,r.duration)}`).join(', ');
}

function openLookup(){ lookupOpen = true; lookupName=''; lookupPin=''; render(); }
function closeLookup(){ lookupOpen = false; render(); }

async function doLookup(){
  const name = lookupName.trim();
  const pin = lookupPin.trim();
  if(!name){ showToast('아이 이름을 입력해 주세요.'); return; }
  if(!/^\d{4}$/.test(pin)){ showToast('확인번호 4자리(숫자)를 정확히 입력해 주세요.'); return; }

  // 1) 이름+확인번호가 정확히 일치하는 신청부터 찾음
  let matches = registrations.filter(r=> r.name===name && r.pin===pin);
  let claimedLegacy = false;

  if(matches.length===0){
    // 2) 없으면, 같은 이름인데 확인번호가 아직 없는 "예전 신청"이 있는지 확인
    const legacy = registrations.filter(r=> r.name===name && !r.pin);
    if(legacy.length>0){
      legacy.forEach(r=> r.pin = pin); // 지금 입력한 번호를 앞으로 쓸 확인번호로 등록
      await saveRegistrations();
      matches = legacy;
      claimedLegacy = true;
    }
  }

  if(matches.length===0){
    showToast('일치하는 신청 내역을 찾을 수 없어요. 이름과 확인번호를 다시 확인해 주세요.');
    return;
  }

  editingKey = { name, pin };
  formName = name;
  formSchool = matches[0].school || '';
  formPin = pin;
  loadPicksFromRegs(matches);
  editingOriginalKeys = flattenPicksToKeys();
  selectedDuration = 'custom'; // 기존 신청은 길이가 섞여 있을 수 있어 혼합 모드로 시작
  lookupOpen = false;
  const schoolTag = matches[0].school ? ` (${matches[0].school})` : '';
  showToast(claimedLegacy
    ? `${name}${schoolTag} 학생의 예전 신청을 찾았어요. 방금 입력하신 번호가 앞으로 쓰실 확인번호로 등록됐어요.`
    : `${name} 학생의 신청 내역을 불러왔어요.`);
  render();
}

function cancelEditing(){
  editingKey = null; editingOriginalKeys = null;
  formName=''; formSchool=''; formPin=''; rawPicks={}; selectedDuration=60;
  render();
}

async function saveForm(){
  const name = formName.trim();
  if(!name){ showToast('아이 이름을 입력해 주세요.'); return; }
  const pin = formPin.trim();
  if(!/^\d{4}$/.test(pin)){ showToast('확인번호 4자리(숫자)를 입력해 주세요.'); return; }

  const isEdit = !!editingKey;
  const arr = mergedSelections();
  const newKeys = flattenPicksToKeys();

  if(!isEdit && arr.length===0){
    showToast('요일과 시간을 한 곳 이상 선택해 주세요.');
    return;
  }
  if(isEdit && arr.length===0){
    if(!window.confirm(`${name} 학생의 신청을 전부 취소할까요?`)) return;
  }

  const ts = Date.now();
  const school = formSchool.trim();

  if(isEdit){
    registrations = registrations.filter(r=> !(r.name===editingKey.name && r.pin===editingKey.pin));
  }
  arr.forEach(s=>{
    registrations.push({ id:uid(), name, school, day:s.day, start:s.start, duration:s.duration, ts, pin });
  });
  await saveRegistrations();

  const addedRuns = isEdit ? keysToRuns(new Set([...newKeys].filter(k=>!editingOriginalKeys.has(k)))) : arr.map(s=>({day:s.day,start:s.start,duration:s.duration}));
  const removedRuns = isEdit ? keysToRuns(new Set([...editingOriginalKeys].filter(k=>!newKeys.has(k)))) : [];
  activityLog.push({
    id: uid(), ts, name, school,
    type: isEdit ? (arr.length===0 ? 'canceled' : 'updated') : 'created',
    addedRuns, removedRuns
  });
  await saveActivityLog();

  const wasEdit = isEdit;
  formName=''; formSchool=''; formPin=''; rawPicks={}; selectedDuration=60;
  editingKey=null; editingOriginalKeys=null;
  showToast(wasEdit ? '변경사항이 저장됐어요.' : '신청이 완료됐어요. 감사합니다!');
}

async function deleteRegistration(id){
  if(!window.confirm('이 신청을 삭제할까요?')) return;
  registrations = registrations.filter(r=>r.id!==id);
  await saveRegistrations();
  render();
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function handleAdminCellClick(day,m){

function buildCellTd(mode,day,m,rowspan){
  const [,close] = dayRange(day);
  const cnt = getOverlapCount(day,m), cap = getCap(day,m);
  const over = isOver(cnt,cap);
  const bg = (mode==='parent') ? '#FBF8F1' : cellColor(cnt,cap); // 학부모 화면은 혼잡도 색상을 보여주지 않음
  const tcolor = textColorFor(cnt,cap);
  let cls = 'cell';
  let onclick = '';
  if(mode==='parent'){
    const satLocked = (day==='토' && !SAT_OPEN_FOR_BOOKING);
    const picked = !satLocked && dayPicks(day).has(m);
    // 편집 중이면 본인의 기존 슬롯은 정원 계산에서 빼서, 자기 자리 때문에 자기가 못 고르는 문제를 방지
    const bookingCnt = getOverlapCountForBooking(day,m);
    const full = isOver(bookingCnt,cap);
    const disabled = satLocked || (!picked && (full || (selectedDuration!=='custom' && (m+selectedDuration > close))));
    if(picked) cls += ' selected';
    else if(disabled) cls += ' disabled';
    onclick = satLocked ? `showToast('토요일 수업은 9월부터 신청할 수 있어요.')` : `toggleSelect('${day}',${m})`;
  } else {
    onclick = `handleAdminCellClick('${day}',${m})`;
  }
  if(mode==='admin' && over) cls += ' over'; // 정원마감 빨간 표시는 관리자 화면에만
  const rs = rowspan>1 ? ` rowspan="${rowspan}"` : '';

  let inner;
  if(mode==='admin' && nameViewMode && !capEditMode){
    // 출석부처럼 시작 시간대에만 학생 이름을 표시
    const starters = registrations.filter(r=> r.day===day && r.start===m);
    cls += ' roster-cell';
    if(starters.length===0){
      inner = '';
    } else {
      inner = starters.map(r=>`<div class="name-line" style="color:${tcolor==='#fff'?'#fff':'var(--navy-dark)'}">${escapeHtml(r.name)}</div>`).join('');
    }
  } else if(mode==='admin'){
    inner = `<div class="count" style="color:${tcolor}">${cnt>0?cnt:''}${over?'!':''}</div>`;
  } else {
    // 학부모 화면: 숫자·색상 없이, 신청가능/마감 상태만 보여줌
    inner = '';
  }

  return `<td class="${cls}"${rs} style="background:${bg}" onclick="${onclick}">${inner}</td>`;
}

function buildGrid(mode){
  let html = `<div class="grid-scroll"><table class="tt"><thead><tr><th class="corner"></th>`;
  DAYS.forEach(d=> html += `<th>${d}</th>`);
  html += `<th class="corner">토요일 시간</th></tr></thead><tbody>`;

  WEEK_SLOTS.forEach((m,i)=>{
    html += `<tr>`;
    html += `<td class="timecell">${m%60===0? timeLabel(m):''}</td>`;
    DAYS.forEach(d=>{
      if(d==='토'){
        if(i % SAT_SPAN === 0){
          const satM = SAT_SLOTS[i/SAT_SPAN];
          html += buildCellTd(mode,'토',satM,SAT_SPAN);
        }
        // 그 외 행은 위 칸의 rowspan에 이미 포함되어 있어 건너뜀
      } else {
        html += buildCellTd(mode,d,m,1);
      }
    });
    if(i % SAT_SPAN === 0){
      const satM = SAT_SLOTS[i/SAT_SPAN];
      const lbl = satM % 60 === 0 ? timeLabel(satM) : '';
      html += `<td class="sat-label" rowspan="${SAT_SPAN}">${lbl}</td>`;
    }
    html += `</tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

  <section class="card">
    <button class="btn-primary" onclick="saveForm()">${editingKey? '변경사항 저장하기' : '신청 완료하기'}</button>
    ${editingKey? `<button class="btn-ghost" style="width:100%;margin-top:10px;justify-content:center;" onclick="clearAllPicks()">이 학생 수업 전체 취소하기</button>` : ''}
  </section>
  `;
  return html;
}

function renderAdminTab(){
  const total = registrations.length;
  const byDay = {};
  DAYS.forEach(d=> byDay[d] = registrations.filter(r=>r.day===d).length);
  const busiest = Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0];

  let html = `
  <div class="admin-toolbar">
    <div class="admin-stats">
      <div class="stat"><div class="num">${total}</div><div class="lbl">전체 신청</div></div>
      <div class="stat"><div class="num">${busiest?busiest[0]:'-'}</div><div class="lbl">가장 붐비는 요일</div></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn-ghost ${nameViewMode?'on':''}" onclick="toggleNameView()">${nameViewMode? '숫자로 보기':'이름으로 보기 (출석부)'}</button>
      <button class="btn-ghost ${capEditMode?'on':''}" onclick="toggleCapEdit()">${capEditMode? '정원 설정 중 (칸 클릭)':'정원 설정하기'}</button>
    </div>
  </div>

  <section class="card">
    <h2>시간표 인쇄</h2>
    <div class="hint">선생님이 그날 수업 준비할 때 보기 편하게, 시간 순서대로 학생 이름을 목록으로 인쇄해요.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <select id="printDaySelect" style="padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;font-family:inherit;font-size:13.5px;background:var(--cream);">
        <option value="all">전체 요일 (월~토)</option>
        ${DAYS.map(d=>`<option value="${d}">${d}요일만</option>`).join('')}
      </select>
      <button class="btn-primary" style="width:auto;padding:10px 20px;" onclick="printSchedule()">인쇄하기</button>
    </div>
  </section>

  <section class="card">
    <h2>요일 · 시간별 신청 현황</h2>
    <div class="hint">${nameViewMode
      ? '학생 이름은 <b>수업 시작 시간</b> 칸에만 표시돼요. 칸 색깔은 그 30분 동안 <b>동시에 수업 중인 학생 수</b> 기준으로 그대로 계산돼요.'
      : '칸의 숫자는 그 30분 동안 <b>동시에 수업 중인 학생 수</b>예요. 왼쪽 시간은 평일 기준, 오른쪽 시간은 토요일 기준이에요. 60/90/120/180분 수업이 겹치는 시간대는 자동으로 합산돼서 진하게 표시돼요.'}</div>
    ${buildGrid('admin')}
    <div class="legend">
      <span><span class="sw" style="background:${HEAT_START}"></span>여유</span>
      <span><span class="sw" style="background:${lerpColor(HEAT_START,HEAT_END,0.6)}"></span>붐빔</span>
      <span><span class="sw" style="background:${RED}"></span>정원 마감</span>
      <span>${capEditMode? '칸을 클릭해 해당 시간의 정원을 바꿀 수 있어요' : '칸을 클릭하면 그 시간에 수업 중인 아이 명단을 볼 수 있어요'}</span>
    </div>
  `;

  if(!capEditMode && viewingCell){
    const [d,mStr] = viewingCell.split('-');
    const m = parseInt(mStr,10);
    const list = getOverlapList(d,m);
    html += `<div class="roster"><h3>${d}요일 ${timeLabel(m)} 수업 중인 아이 (${list.length}명 / 정원 ${getCap(d,m)}명)</h3>`;
    if(list.length===0){ html += `<div class="empty">이 시간에 수업 중인 아이가 없어요.</div>`; }
    else{
      list.forEach(r=>{
        html += `<div class="roster-row">
          <div><span class="name">${r.name}</span> <span class="meta">${r.school?('· '+r.school+' · '):'· '}${rangeLabel(r.start,r.duration)} (${r.duration}분)</span></div>
          <button class="del-btn" onclick="deleteRegistration('${r.id}')">삭제</button>
        </div>`;
      });
    }
    html += `</div>`;
  }
  html += `</section>`;

  html += `
  <section class="card">
    <h2>최근 변경 내역</h2>
    <div class="hint">학부모가 새로 신청하거나, 스스로 시간표를 확인·변경·취소하면 여기에 자동으로 기록돼요.</div>
  `;
  if(activityLog.length===0){
    html += `<div class="empty">아직 기록이 없어요.</div>`;
  } else {
    const sorted = [...activityLog].sort((a,b)=> b.ts - a.ts).slice(0,50);
    sorted.forEach(a=>{
      const isNew = a.ts > sessionAdminCutoff;
      const typeLabel = a.type==='created' ? '신청' : (a.type==='canceled' ? '취소' : '변경');
      const added = runsLabel(a.addedRuns);
      const removed = runsLabel(a.removedRuns);
      html += `<div class="roster-row" style="align-items:flex-start;${isNew?'background:#FDECEA;border-radius:6px;padding:8px;':''}">
        <div>
          ${isNew? `<span class="badge" style="margin-left:0;margin-right:6px;">N</span>`:''}
          <span class="name">${escapeHtml(a.name)}</span>
          <span class="meta">${a.school? ('· '+escapeHtml(a.school)+' · '):'· '}${typeLabel} · ${formatTs(a.ts)}</span>
          <div style="font-size:11.5px;color:var(--ink-soft);margin-top:3px;">
            ${added? `추가: ${escapeHtml(added)}` : ''}${added&&removed? ' / ' : ''}${removed? `삭제: ${escapeHtml(removed)}` : ''}
            ${(!added && !removed)? '변경된 시간 없음' : ''}
          </div>
        </div>
      </div>`;
    });
  }
  html += `</section>`;

  const noticeText = `[9월 시간표 신청 안내]
아래 링크에서 아이 이름, 수업 시간(60/90/120/180분 또는 기타), 원하는 요일과 시간을 선택해 신청해 주세요.
9월부터 토요일 수업도 함께 신청받으니, 토요일에 오는 친구도 지금 신청해 주세요.
(칸 색이 진할수록 이미 신청이 몰린 시간대예요)

신청 링크: (이 앱 공유 링크를 붙여넣어 주세요)

문의사항은 학원으로 연락 주세요. 감사합니다.`;

  html += `
  <section class="card">
    <h2>학부모 공지문 (복사해서 사용하세요)</h2>
    <textarea class="notice-box" id="noticeBox" readonly>${noticeText}</textarea>
    <div class="copy-row">
      <button class="btn-ghost" onclick="copyNotice()">문구 복사하기</button>
    </div>
  </section>
  `;

  return html;
}

function copyNotice(){
  const box = document.getElementById('noticeBox');
  box.select();
  document.execCommand('copy');
  showToast('공지문이 복사됐어요.');
}

function dayRegistrationsSorted(day){
  return registrations.filter(r=>r.day===day).sort((a,b)=> a.start-b.start);
}

function buildPrintDaySection(day){
  const list = dayRegistrationsSorted(day);
  let html = `<div class="print-day">
    <div class="print-day-title">${day}요일 시간표</div>`;
  if(list.length===0){
    html += `<div class="print-empty">신청된 학생이 없어요.</div>`;
  } else {
    html += `<table class="print-table"><thead><tr><th>시간</th><th>이름</th><th>학교/학년</th><th>길이</th></tr></thead><tbody>`;
    list.forEach(r=>{
      html += `<tr>
        <td>${rangeLabel(r.start,r.duration)}</td>
        <td>${escapeHtml(r.name)}</td>
        <td>${escapeHtml(r.school||'')}</td>
        <td>${r.duration}분</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;
  return html;
}

function printSchedule(){
  const sel = document.getElementById('printDaySelect');
  const val = sel ? sel.value : 'all';
  const days = (val==='all') ? DAYS : [val];
  const today = new Date();
  const dateStr = `${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 출력`;

  let html = `<div class="print-header"><div class="print-title">리드인 장자호수점 · 수업 시간표</div><div class="print-date">${dateStr}</div></div>`;
  days.forEach(d=> html += buildPrintDaySection(d));

  let area = document.getElementById('printArea');
  if(!area){
    area = document.createElement('div');
    area.id = 'printArea';
    document.body.appendChild(area);
  }
  area.innerHTML = html;
  window.print();
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="masthead">
      <div>
        <div class="title">9월 시간표 신청</div>
        <div class="sub">월~금 오후 2시~8시 · 토요일 오전 10시~오후 1시, 요일과 시간을 선택해 신청해 주세요.</div>
      </div>
    </div>
    ${(tab==='parent' && isAdminDevice() && newRegCount()>0) ? `
    <div class="new-banner" onclick="switchTab('admin')">
      <span class="txt"><span class="dot">${newRegCount()}</span> 새로운 신청이 있어요</span>
      <span class="arrow">확인하기 →</span>
    </div>` : ''}
    ${tab==='parent' ? renderParentTab() : renderAdminTab()}
    ${toastMsg? `<div class="toast">${toastMsg}</div>` : ''}
    <div class="footer-admin">
      ${tab==='parent'
        ? `<a href="javascript:void(0)" onclick="switchTab('admin')">관리자${(isAdminDevice() && newRegCount()>0) ? `<span class="badge">${newRegCount()}</span>` : ''}</a>`
        : `<a href="javascript:void(0)" onclick="switchTab('parent')">← 처음 화면으로</a>`}
    </div>
  `;
}

function renderLoadError(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div style="max-width:480px;margin:60px auto;text-align:center;padding:24px;">
      <div style="font-size:16px;font-weight:700;color:var(--navy-dark);margin-bottom:10px;">페이지를 불러오지 못했어요</div>
      <div style="font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:18px;">
        네트워크 상태가 좋지 않거나, 이 브라우저에서 일부 기능이 막혀있을 수 있어요.<br>
        카카오톡 안에서 보고 계시다면, 오른쪽 위 '…' 메뉴에서 <b>다른 브라우저로 열기</b>를 눌러보시면 잘 될 수 있어요.
      </div>
      <button class="btn-primary" style="max-width:220px;margin:0 auto;" onclick="location.reload()">다시 시도</button>
    </div>
  `;
}

(async function init(){
  try{
    const sdk = await waitForSupabaseSdk(10000); // 최대 10초까지 SDK 로딩을 기다림
    sb = sdk.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    await withTimeout(loadData(), 9000, null); // 데이터 로딩도 9초 넘으면 그냥 진행
    render();
  }catch(e){
    renderLoadError();
  }
})();
</script>
</body>
</html>
